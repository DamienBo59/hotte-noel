# Supabase met en pause un projet gratuit après 7 jours sans requête.
# Ce job appelle la base tous les 3 jours pour que la hotte reste en ligne.
name: Garder la hotte éveillée
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS -X POST "https://cztfwpewqhbflfubtufm.supabase.co/rest/v1/rpc/hotte_ping" \
            -H "apikey: sb_publishable_gs8_YU1PZQ7YJdwSfL9P-Q_vDGwHhFu" -H "Content-Type: application/json" -d '{}'
